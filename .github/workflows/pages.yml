name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Local links and assets resolve
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path("site")
          bad = []
          for page in root.glob("*.html"):
              txt = page.read_text()
              for ref in re.findall(r'(?:href|src|poster)="([^"#?]+)', txt):
                  if re.match(r"^(https?:|mailto:|data:)", ref):
                      continue
                  if not (root / ref).exists():
                      bad.append(f"{page.name}: {ref}")
          print("\n".join(bad) or "all local references resolve")
          sys.exit(1 if bad else 0)
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
