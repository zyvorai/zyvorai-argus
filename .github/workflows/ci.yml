name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -e ".[dev,knowledge,otel]"

      - name: Ruff lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit -q

      - name: CLI help groups
        run: |
          argus --help | tee /tmp/argus-help.txt
          grep -q 'Operate' /tmp/argus-help.txt
          grep -q 'Testing' /tmp/argus-help.txt
          grep -q 'Security' /tmp/argus-help.txt
          grep -q 'Watch' /tmp/argus-help.txt
          argus guard --help | tee /tmp/argus-guard-help.txt
          grep -q 'Scan' /tmp/argus-guard-help.txt
          grep -q 'Attack' /tmp/argus-guard-help.txt
          grep -q 'Gate' /tmp/argus-guard-help.txt

      - name: Node syntax check (Playwright scripts)
        run: |
          for f in playwright/scripts/*.mjs; do
            node --check "$f"
          done

  dashboard-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          pip install -e .
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Mission Control
        run: |
          argus serve --port 8080 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/dashboard -o /dev/null && exit 0
            sleep 2
          done
          cat serve.log
          exit 1

      - name: Axe and keyboard check (light and dark)
        run: ARGUS_BASE_URL=http://127.0.0.1:8080 node scripts/e2e-dashboard-a11y.mjs

      - name: Server log
        if: failure()
        run: cat serve.log

  docs-and-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Kubernetes manifests
        run: python3 scripts/validate_k8s_manifests.py

      - name: User docs are up to date with routes.json/page-purposes.json
        run: |
          npm run docs:guides
          git diff --exit-code -- docs/user/ || {
            echo "::error::docs/user/ is stale — run 'npm run docs:guides' and commit the result."
            exit 1
          }

      - name: Check user docs for broken relative links
        run: npm run docs:links
