name: Security and Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e '.[dev,knowledge,otel]' mypy pip-audit bandit[toml] pytest-cov
      - run: ruff check .
      - run: mypy orchestrator agents --ignore-missing-imports
      # TODO: raise back toward 70% as test coverage improves. Raised 47 -> 50
      # after the contract/SCA/db_assert/chaos test-capability phases added
      # heavily-covered new packages (~50% -> ~53.47% actual); see ROADMAP.md's
      # "Test coverage" section for what's left (jobs.py's _job_* wrappers,
      # cli.py, dashboard/k8s.py -- real subprocess/Playwright/network calls,
      # the genuinely low-marginal-value remainder).
      - run: pytest tests/unit --cov=orchestrator --cov=agents --cov-report=term-missing --cov-fail-under=50
      - run: pip-audit
      - run: bandit -q -c pyproject.toml -r orchestrator agents -x tests

  postgres-quality:
    # PostgresStore (orchestrator/persistence/postgres_store.py) is the
    # opt-in multi-replica backend behind get_store() -- exercised only
    # when ZYVOR_STATE_DB is a postgresql:// URL, so python-quality's
    # default SQLite-backed run above never touches this code path. A real
    # `postgres:` service container here is what keeps it from silently
    # bit-rotting untested between the (rare) times someone runs it locally.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e '.[dev,postgres]'
      - run: pytest tests/unit/test_postgres_store.py -v
        env:
          TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/postgres

  node-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: |
          for f in playwright/scripts/*.mjs; do node --check "$f"; done

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.secure
          push: false
          load: true
          tags: zyvor-argus:test
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zyvor-argus:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          # TypeScript 7's native compiler ships a Go binary; it is a build-time dev
          # tool (tsc --noEmit), never executed at runtime, and its Go stdlib is
          # upstream-pinned.
          skip-files: '**/@typescript/typescript-*/lib/tsc'
          # trivy's secret scanner flags example strings inside the anthropic SDK's own
          # source (agents.py, *_params.py); package metadata is still vuln-scanned.
          skip-dirs: '/opt/venv/lib/python3.11/site-packages/anthropic'
          exit-code: '1'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI is free; gitleaks-action needs a paid licence key for organisations.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner
