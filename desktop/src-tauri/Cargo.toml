[package]
name = "zyvor-argus-desktop"
version = "0.1.2"
description = "Zyvor Argus — native desktop shell around `argus serve`"
edition = "2021"

[lib]
name = "zyvor_argus_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
