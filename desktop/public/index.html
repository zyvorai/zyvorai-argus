<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zyvor Argus</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0c0d12; --fg: #f5f5f7; --muted: rgba(235,235,245,0.62); --accent: #2997ff; --accent-fill: #0a6cf0;
      --err: #ff453a; --ok: #30d158; --fill: rgba(120,120,128,0.24); --edge: rgba(255,255,255,0.12);
      --card: rgba(44,44,50,0.62);
      --wallpaper: radial-gradient(55% 60% at 8% 4%, rgba(60,90,220,0.34), transparent 62%),
        radial-gradient(50% 55% at 94% 6%, rgba(150,70,200,0.26), transparent 64%),
        radial-gradient(60% 60% at 82% 98%, rgba(30,170,190,0.2), transparent 62%);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef1f8; --fg: #1d1d1f; --muted: #55555b; --accent: #0071e3; --err: #d92d20; --ok: #1f9d44;
        --fill: rgba(120,120,128,0.14); --edge: rgba(60,60,67,0.14); --card: rgba(255,255,255,0.72);
        --wallpaper: radial-gradient(60% 70% at 10% 6%, #a9cdff, transparent 60%),
          radial-gradient(55% 60% at 90% 4%, #ffc6e0, transparent 62%),
          radial-gradient(60% 65% at 80% 98%, #ffdcab, transparent 60%);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--wallpaper), var(--bg); background-attachment: fixed; color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    code { background: var(--fill); padding: 2px 6px; border-radius: 6px; font-size: 0.92em; }
    :focus-visible { outline: 3px solid rgba(41,151,255,0.45); outline-offset: 2px; }
    body { display: flex; align-items: center; justify-content: center; }
    .panel { text-align: center; max-width: 420px; padding: 36px 32px; background: var(--card); border-radius: 22px;
      -webkit-backdrop-filter: blur(34px) saturate(180%); box-shadow: 0 0 0 0.5px var(--edge), 0 24px 60px -20px rgba(0,0,0,0.5); }
    .logo { width: 64px; height: 64px; border-radius: 22%; margin: 0 auto 18px; display: block;
      box-shadow: 0 0 0 1px var(--edge), 0 10px 30px rgba(124,108,255,0.35); }
    .bar { width: 120px; height: 4px; margin: 0 auto 18px; border-radius: 4px; background: var(--fill); overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: var(--accent);
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    h1 { font-size: 16px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.01em; }
    p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
    .error { color: var(--err); }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div class="panel">
    <img class="logo" src="argus-icon.svg" alt="" width="64" height="64" />
    <div class="bar" id="spinner" role="progressbar" aria-label="Starting"></div>
    <h1 id="title">Starting Zyvor Argus…</h1>
    <p id="detail">Launching the local Mission Control server.</p>
  </div>

  <script>
    // No bundler/build step by design (see desktop plan) — Tauri's global
    // `window.__TAURI__` API is enabled via `app.withGlobalTauri` in
    // tauri.conf.json instead of pulling in @tauri-apps/api.
    const titleEl = document.getElementById("title");
    const detailEl = document.getElementById("detail");
    const spinnerEl = document.getElementById("spinner");

    const POLL_INTERVAL_MS = 400;
    const MAX_ATTEMPTS = 75; // ~30s

    function showError(message) {
      spinnerEl.style.display = "none";
      titleEl.textContent = "Couldn't start the local server";
      titleEl.classList.add("error");
      detailEl.innerHTML = message;
    }

    async function poll(attempt) {
      if (!window.__TAURI__) {
        showError("Tauri bridge unavailable — this page must be opened inside the desktop app.");
        return;
      }
      try {
        const url = await window.__TAURI__.core.invoke("dashboard_url");
        if (url) {
          detailEl.textContent = "Ready — opening Mission Control…";
          window.location.replace(url);
          return;
        }
        // No url yet and no error thrown = still starting; keep polling.
      } catch (err) {
        // The Rust side only rejects dashboard_url for a genuine, permanent
        // failure (ServerStatus::Failed) — "still starting" is Ok(None), not
        // a rejection. So there's nothing to gain by waiting out the retry
        // budget here; show it immediately instead of leaving the spinner
        // up for up to MAX_ATTEMPTS * POLL_INTERVAL_MS on an error that will
        // never resolve on its own.
        showError(
          "<code>argus serve</code> failed to start.<br>" +
          String(err || "unknown error")
        );
        return;
      }
      if (attempt >= MAX_ATTEMPTS) {
        showError("<code>argus serve</code> did not start in time.");
        return;
      }
      setTimeout(() => poll(attempt + 1), POLL_INTERVAL_MS);
    }

    poll(0);
  </script>
</body>
</html>
