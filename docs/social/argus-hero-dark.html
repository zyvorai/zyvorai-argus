<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Argus hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  argus-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:112px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>Autonomous QA platform</span></div>
  <div class="word">Argus</div>
  <div class="tag">Specs in. Tests out.<br><em>Know what broke.</em></div>
  <div class="lede">Reads requirements, scores them, generates Playwright tests, runs them on every deploy, and shows failures in Mission Control.</div>
  <div class="stats"><div class="stat"><b>7</b><span>spec sources</span></div><div class="stat"><b>0</b><span>LLM keys for smoke</span></div><div class="stat"><b>15</b><span>guard commands</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/zyvorai-argus</span><span>Zyvor Production</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// Argus: the hundred-eyed watcher. A polar field of tiny eyes (tests); a radar sweep wakes them up.
// Passing tests open green/blue, a few failures stare back red and are flagged to Mission Control.
var C = Z.c, cx = 400, cy = 296, R = 236;
var defs = Z.el('defs', {});
defs.innerHTML = '<filter id="arGl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="arSf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>' +
  '<radialGradient id="arDisc"><stop offset="0" stop-color="#0a2340" stop-opacity=".85"/><stop offset=".8" stop-color="#06121f" stop-opacity=".6"/><stop offset="1" stop-color="#06121f" stop-opacity="0"/></radialGradient>' +
  '<radialGradient id="arIris"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#64d2ff"/><stop offset="1" stop-color="#0071e3"/></radialGradient>';

Z.el('circle', { cx: cx, cy: cy, r: R + 20, fill: 'url(#arDisc)' });
// range rings and bearing ticks
[0.25, 0.5, 0.75, 1].forEach(function (f, i) {
  Z.el('circle', { cx: cx, cy: cy, r: R * f, fill: 'none', stroke: 'rgba(100,210,255,' + (i === 3 ? .35 : .14) + ')', 'stroke-width': i === 3 ? 1.4 : 1, 'stroke-dasharray': i === 3 ? 'none' : '1 5' });
});
for (var k = 0; k < 72; k++) {
  var a = k / 72 * Math.PI * 2, l = k % 6 === 0 ? 12 : 5;
  Z.el('line', { x1: cx + (R + 4) * Math.cos(a), y1: cy + (R + 4) * Math.sin(a), x2: cx + (R + 4 + l) * Math.cos(a), y2: cy + (R + 4 + l) * Math.sin(a), stroke: 'rgba(100,210,255,.4)', 'stroke-width': 1 });
}
[0, 1, 2, 3].forEach(function (q) {
  var a = q * Math.PI / 2;
  Z.el('line', { x1: cx + 28 * Math.cos(a), y1: cy + 28 * Math.sin(a), x2: cx + R * Math.cos(a), y2: cy + R * Math.sin(a), stroke: 'rgba(100,210,255,.1)' });
});

// sweep wedge (trail fades counter-clockwise behind the beam)
var SW = -0.62, TRAIL = 1.9, steps = 60;
for (var s = 0; s < steps; s++) {
  var a1 = SW - s / steps * TRAIL, a0 = SW - (s + 1) / steps * TRAIL;
  var p0x = cx + R * Math.cos(a0), p0y = cy + R * Math.sin(a0), p1x = cx + R * Math.cos(a1), p1y = cy + R * Math.sin(a1);
  Z.el('path', { d: 'M' + cx + ',' + cy + ' L' + p0x.toFixed(1) + ',' + p0y.toFixed(1) + ' A' + R + ',' + R + ' 0 0 1 ' + p1x.toFixed(1) + ',' + p1y.toFixed(1) + 'Z',
    fill: '#2997ff', opacity: (0.42 * Math.pow(1 - s / steps, 1.8)).toFixed(3) });
}

// eyes on polar rings
function eye(x, y, w, col, op, pupil) {
  var g = Z.g({ transform: 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')', opacity: op.toFixed(2) });
  var h = w * 0.62;
  Z.el('path', { d: 'M' + (-w) + ',0 Q0,' + (-h * 1.6) + ' ' + w + ',0 Q0,' + (h * 1.6) + ' ' + (-w) + ',0Z', fill: 'rgba(4,10,18,.85)', stroke: col, 'stroke-width': 1.1 }, g);
  Z.el('circle', { cx: 0, cy: 0, r: h * 0.78, fill: col }, g);
  if (pupil) Z.el('circle', { cx: 0, cy: 0, r: h * 0.34, fill: '#02060c' }, g);
  return g;
}
var failSpots = [[222, -2.35], [176, 2.35], [176, 0.62], [104, -1.2]].map(function (q) { return { x: cx + q[0] * Math.cos(q[1]), y: cy + q[0] * Math.sin(q[1]), w: 5.5 }; });
var fails = failSpots, rings = [56, 80, 104, 128, 152, 176, 200, 222];
rings.forEach(function (r, ri) {
  var n = Math.round(r / 5.2), off = Z.rnd() * Math.PI;
  for (var j = 0; j < n; j++) {
    var a = off + j / n * Math.PI * 2 + (Z.rnd() - .5) * 0.08, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    var behind = SW - Math.atan2(Math.sin(a), Math.cos(a));
    while (behind < 0) behind += Math.PI * 2;
    while (behind > Math.PI * 2) behind -= Math.PI * 2;
    var w = 3.4 + ri * 0.5;
    if (failSpots.some(function (f) { return Math.abs(f.x - x) < 15 && Math.abs(f.y - y) < 15; })) continue;
    if (behind < TRAIL) {
      var f = 1 - behind / TRAIL;
      var col = Z.rnd() < 0.55 ? C.green : (Z.rnd() < 0.5 ? C.cyan : C.signal);
      eye(x, y, w, col, 0.35 + f * 0.65, true);
    } else {
      Z.el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 1.4, fill: '#8fbfff', opacity: (0.18 + Z.rnd() * 0.2).toFixed(2) });
    }
  }
});
// failures always stare back
fails.forEach(function (f) {
  Z.el('circle', { cx: f.x, cy: f.y, r: 16, fill: C.red, opacity: .25, filter: 'url(#arSf)' });
  Z.el('circle', { cx: f.x, cy: f.y, r: 13, fill: 'none', stroke: C.red, 'stroke-width': 1, opacity: .6, 'stroke-dasharray': '2 3' });
  var g = eye(f.x, f.y, f.w + 1.5, C.red, 1, true); g.setAttribute('filter', 'url(#arGl)');
});

// beam
var bx = cx + R * Math.cos(SW), by = cy + R * Math.sin(SW);
Z.el('line', { x1: cx, y1: cy, x2: bx, y2: by, stroke: '#cfe6ff', 'stroke-width': 2, filter: 'url(#arGl)' });
Z.el('circle', { cx: bx, cy: by, r: 4, fill: '#fff', filter: 'url(#arGl)' });

// central great eye
Z.el('circle', { cx: cx, cy: cy, r: 44, fill: '#2997ff', opacity: .3, filter: 'url(#arSf)' });
Z.el('path', { d: 'M' + (cx - 40) + ',' + cy + ' Q' + cx + ',' + (cy - 38) + ' ' + (cx + 40) + ',' + cy + ' Q' + cx + ',' + (cy + 38) + ' ' + (cx - 40) + ',' + cy + 'Z', fill: 'rgba(4,10,18,.95)', stroke: '#cfe6ff', 'stroke-width': 1.6, filter: 'url(#arGl)' });
Z.el('circle', { cx: cx, cy: cy, r: 15, fill: 'url(#arIris)' });
Z.el('circle', { cx: cx, cy: cy, r: 6, fill: '#02060c' });
Z.el('circle', { cx: cx + 5, cy: cy - 5, r: 2.4, fill: '#fff' });

// flag the worst failure to Mission Control
var F = fails[2];
var lx = 590, ly = 470;
Z.el('path', { d: 'M' + F.x.toFixed(1) + ',' + F.y.toFixed(1) + ' Q' + (F.x + 50).toFixed(1) + ',' + (F.y + 10).toFixed(1) + ' ' + lx + ',' + (ly - 16), fill: 'none', stroke: C.red, 'stroke-width': 1.2, 'stroke-dasharray': '3 4', opacity: .8 });
Z.label(lx, ly + 6, '<b class="bad">failed</b><span>checkout.spec.ts</span>', 'box');
Z.label(cx, 590, '<b>Mission Control</b><span>tests on every deploy &middot; see what broke</span>');
Z.label(560, 46, 'Playwright &middot; @smoke', 'chip');
})();
</script>
</body>
</html>
